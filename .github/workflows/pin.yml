name: Trendy Tools Hub - Auto Pin

# WHEN it runs
on:
  workflow_dispatch:      # lets you click "Run" manually to test
  schedule:
    - cron: "30 4 * * *"  # every day at 10:00 AM India time (04:30 UTC)

jobs:
  make-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the pin bot
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_KEY:   ${{ secrets.OPENROUTER_KEY }}
          CF_ACCOUNT_ID:    ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_TAG:       ${{ secrets.AMAZON_TAG }}
          PIN_ACCESS_TOKEN: ${{ secrets.PIN_ACCESS_TOKEN }}
          PIN_BOARD_ID:     ${{ secrets.PIN_BOARD_ID }}
        run: python bot.py
